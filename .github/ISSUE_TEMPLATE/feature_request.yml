# SPDX-License-Identifier: AGPL-3.0-or-later
name: Idea or feature request
description: Something Keepjay should do, or do differently.
labels: [idea]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation and what gets in the way. This matters more than the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: Optional. How you imagine it working.
  - type: markdown
    attributes:
      value: |
        Check the [roadmap](https://github.com/mo-sajaad/scrubjay/blob/main/docs/specs/11-roadmap.md)
        first: some features are planned, and some are frozen for now (D-028).
