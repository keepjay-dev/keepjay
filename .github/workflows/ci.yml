# SPDX-License-Identifier: AGPL-3.0-or-later
name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Lint, format & licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - name: SPDX headers (NFR-MAINT-006)
        run: scripts/check-spdx.sh
      - run: rustup toolchain install
      - run: cargo fmt --all --check
      - name: Dependency licences, bans & sources (D-020)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources

  build-test:
    name: Build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux system dependencies (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build design tokens and desktop frontend
        run: pnpm build
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Smoke test, CLI and desktop share one database (M0.3 exit criterion)
        shell: bash
        run: |
          export SCRUBJAY_DATA_DIR="$RUNNER_TEMP/scrubjay-smoke"
          cargo build --workspace
          ./target/debug/scrubjay init --workspace "Smoke test"
          ./target/debug/scrubjay doctor
          out="$(./target/debug/scrubjay-desktop --print-status)"
          echo "$out"
          echo "$out" | grep -q '"workspaces": 1'
