[workspace]
resolver = "3"
members = ["crates/study-core", "apps/cli", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/mo-sajaad/custom-study-app"
rust-version = "1.97"

[workspace.dependencies]
study-core = { path = "crates/study-core" }
rusqlite = { version = "0.37", features = ["bundled"] }
uuid = { version = "1", features = ["v7"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
directories = "6"
clap = { version = "4", features = ["derive", "env"] }
tempfile = "3"
fsrs = "7"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
