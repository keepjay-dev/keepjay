[workspace]
resolver = "3"
members = ["crates/study-core", "apps/cli", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.2.0-alpha.1"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/mo-sajaad/scrubjay"
rust-version = "1.97"

[workspace.dependencies]
study-core = { path = "crates/study-core" }
rusqlite = { version = "0.37", features = ["bundled", "collation"] }
uuid = { version = "1", features = ["v7"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
directories = "6"
clap = { version = "4", features = ["derive", "env"] }
tempfile = "3"
fsrs = "7"
jiff = "1"
ratatui = "0.30"
zip = { version = "9", default-features = false, features = ["deflate"] }
ruzstd = "0.9"
sha2 = "0.10"
ignore = "0.4.34"
rustix = { version = "1.1.6", default-features = false, features = ["std", "fs"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
