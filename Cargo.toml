[workspace]
resolver = "3"
members = ["crates/study-core", "apps/cli"]

[workspace.package]
version = "0.2.0-alpha.3"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/keepjay-dev/keepjay"
rust-version = "1.97"

[workspace.dependencies]
study-core = { path = "crates/study-core" }
rusqlite = { version = "0.37", features = ["bundled", "collation"] }
uuid = { version = "1", features = ["v4", "v7"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
directories = "6"
clap = { version = "4", features = ["derive", "env"] }
tempfile = "3"
fsrs = "7"
jiff = "1"
ratatui = "0.30"
zip = { version = "9", default-features = false, features = ["deflate"] }
ruzstd = "0.9"
sha2 = "0.10"
ignore = "0.4.34"
pulldown-cmark = { version = "0.13.6", default-features = false }
# The usage ping (D-040): rustls with ring and Mozilla's roots built in. The OS certificate
# store would link Security.framework on macOS, adding ~4 ms to every command's startup.
ureq = { version = "3.5.2", default-features = false, features = ["rustls-no-provider", "rustls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustix = { version = "1.1.6", default-features = false, features = ["std", "fs"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
